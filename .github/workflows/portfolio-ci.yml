name: Portfolio CI
on:
  push:
    paths: ['portfolio/**', '.github/workflows/portfolio-ci.yml']
  pull_request:
    paths: ['portfolio/**', '.github/workflows/portfolio-ci.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile sources
        run: python -m compileall -q portfolio/projects
      - name: Run independent suites
        run: python portfolio/scripts/test_all.py
      - name: Run CLI examples
        run: python portfolio/scripts/smoke_all.py
