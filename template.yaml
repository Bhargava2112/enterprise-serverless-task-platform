AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Secure tenant-scoped task management service
Globals:
  Function:
    Runtime: python3.12
    Timeout: 10
    MemorySize: 256
    Architectures: [arm64]
    Tracing: Active
Resources:
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      Schema:
        - Name: tenant_id
          AttributeDataType: String
          Mutable: false
          Required: false
          StringAttributeConstraints: {MinLength: '1', MaxLength: '64'}
        - Name: role
          AttributeDataType: String
          Mutable: false
          Required: false
          StringAttributeConstraints: {MinLength: '5', MaxLength: '6'}
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: true
  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      ExplicitAuthFlows: [ALLOW_USER_SRP_AUTH, ALLOW_REFRESH_TOKEN_AUTH]
      PreventUserExistenceErrors: ENABLED
      ReadAttributes: [email, 'custom:tenant_id', 'custom:role']
      WriteAttributes: [email]
  TasksApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: v1
      Auth:
        DefaultAuthorizer: CognitoJwt
        Authorizers:
          CognitoJwt:
            IdentitySource: '$request.header.Authorization'
            JwtConfiguration:
              issuer: !GetAtt UserPool.ProviderURL
              audience:
                - !Ref UserPoolClient
  TasksTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      SSESpecification: {SSEEnabled: true}
      PointInTimeRecoverySpecification: {PointInTimeRecoveryEnabled: true}
      AttributeDefinitions:
        - {AttributeName: pk, AttributeType: S}
        - {AttributeName: sk, AttributeType: S}
        - {AttributeName: ownerPk, AttributeType: S}
      KeySchema:
        - {AttributeName: pk, KeyType: HASH}
        - {AttributeName: sk, KeyType: RANGE}
      GlobalSecondaryIndexes:
        - IndexName: OwnerIndex
          KeySchema:
            - {AttributeName: ownerPk, KeyType: HASH}
            - {AttributeName: sk, KeyType: RANGE}
          Projection: {ProjectionType: ALL}
  TasksFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: taskplatform.handler.lambda_handler
      Environment:
        Variables:
          TASKS_TABLE: !Ref TasksTable
          LOG_LEVEL: INFO
      Policies:
        - DynamoDBCrudPolicy: {TableName: !Ref TasksTable}
      Events:
        Health:
          Type: HttpApi
          Properties:
            ApiId: !Ref TasksApi
            Path: /health
            Method: GET
            Auth: {Authorizer: NONE}
        CreateTask:
          Type: HttpApi
          Properties: {ApiId: !Ref TasksApi, Path: /tasks, Method: POST}
        ListTasks:
          Type: HttpApi
          Properties: {ApiId: !Ref TasksApi, Path: /tasks, Method: GET}
        GetTask:
          Type: HttpApi
          Properties: {ApiId: !Ref TasksApi, Path: '/tasks/{taskId}', Method: GET}
        UpdateTask:
          Type: HttpApi
          Properties: {ApiId: !Ref TasksApi, Path: '/tasks/{taskId}', Method: PATCH}
        DeleteTask:
          Type: HttpApi
          Properties: {ApiId: !Ref TasksApi, Path: '/tasks/{taskId}', Method: DELETE}
        Audit:
          Type: HttpApi
          Properties: {ApiId: !Ref TasksApi, Path: /audit, Method: GET}
Outputs:
  ApiUrl:
    Description: HTTP API base URL
    Value: !Sub 'https://${TasksApi}.execute-api.${AWS::Region}.amazonaws.com/v1'
  UserPoolId: {Value: !Ref UserPool}
  UserPoolClientId: {Value: !Ref UserPoolClient}
  TasksTableName: {Value: !Ref TasksTable}